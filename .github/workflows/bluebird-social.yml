name: Bluebird Social (weekly Instagram + Facebook)
# Mirrors Bloom's pipeline. Runs Thursday 5pm Brisbane and posts the COMING
# SATURDAY's forecast so people can plan the weekend.
# Screenshots the 3 regional BEST SPOT views (QLD, NSW, WA), commits them for
# public raw URLs, then posts ONE separate single-image post per region
# (grid reads WA-NSW-QLD left->right).
# Uses its OWN post_instagram_bluebird.js (Bluebird captions). Bloom untouched.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 4'        # Thu 07:00 UTC = Thu 5pm Brisbane (weekly weekend forecast)
concurrency:
  group: bluebird-social
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright + Chromium
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install playwright
          npx playwright install --with-deps chromium
      - name: Screenshot the 3 report cards
        run: node shoot-bluebird.js
      - name: Commit screenshots (non-fatal)
        continue-on-error: true
        run: |
          git config user.name  "bluebird-bot"
          git config user.email "bot@bluebirdday.app"
          git add social/ || true
          git commit -m "social: $(TZ=Australia/Brisbane date +%F)" || echo "nothing to commit"
          git pull --rebase origin ${{ github.ref_name }} || echo "rebase skipped"
          git push || echo "push failed (non-fatal)"
      - name: Post to Instagram (one post per region)
        env:
          IG_USER_ID:      ${{ secrets.BLUEBIRD_IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.BLUEBIRD_IG_ACCESS_TOKEN }}
          GITHUB_RUN_ID:   ${{ github.run_id }}
        run: node post_instagram_bluebird.js

      # ONE combined Facebook Page post: an AI-written weekend caption + all 3
      # region screenshots. Runs even if the Instagram step failed (independent),
      # as long as the screenshots were produced. Skips cleanly if FB secrets are
      # absent so the workflow never breaks before you've set them up.
      - name: Post to Facebook Page (AI caption + gallery)
        if: always()
        env:
          FB_PAGE_ID:           ${{ secrets.BLUEBIRD_FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.BLUEBIRD_FB_PAGE_TOKEN }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
          AI_MODEL:             ${{ vars.BLUEBIRD_AI_MODEL }}
          GITHUB_RUN_ID:        ${{ github.run_id }}
        run: |
          if [ -z "$FB_PAGE_ID" ]; then echo "FB secrets not set yet — skipping Facebook step"; exit 0; fi
          node post_facebook_bluebird.js
