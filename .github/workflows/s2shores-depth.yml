name: S2Shores Depth Proof (Fish Rock)
# Wave-inversion bathymetry over Gold Coast dive spots (Palm Beach, Currumbin,
# Kirra, Burleigh), 3x3 grid each, from the FREE public Sentinel-2 bucket.
# Scene S2B 2026-07-28 T56JNP (2.4% cloud, same pass that read clean at Fish Rock).
on:
  workflow_dispatch:

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: System deps (GDAL + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev python3-gdal jq
          gdalinfo --version

      - name: Clone S2Shores (code + CNES delta-time tables)
        run: git clone --depth 1 https://github.com/CNES/S2Shores.git S2Shores

      - name: Python environment
        run: |
          python3 -m venv --system-site-packages venv
          ./venv/bin/pip install -q --upgrade pip
          ./venv/bin/pip install -q rasterio xarray netcdf4 shapely \
            "dask[dataframe]" distributed numba matplotlib pyyaml click pandas pyarrow cmcrameri
          ./venv/bin/pip install -q --no-deps ./S2Shores
          ./venv/bin/pip install -q "numpy<2" "scipy<1.14" "scikit-image<0.25"
          ./venv/bin/python -c "import numpy; from osgeo import gdal, gdal_array; import s2shores; print('READY - GDAL', gdal.__version__, 'NumPy', numpy.__version__)"

      - name: Download scene subset from public GCS bucket
        run: |
          set -e
          BUCKET=gcp-public-data-sentinel-2
          PROD=S2B_MSIL1C_20260728T235229_N0512_R130_T56JNP_20260729T021752.SAFE
          PREFIX=tiles/56/J/NP/$PROD/
          : > objects.txt
          PAGE=""
          while : ; do
            URL="https://storage.googleapis.com/storage/v1/b/$BUCKET/o?prefix=$PREFIX&maxResults=1000"
            [ -n "$PAGE" ] && URL="$URL&pageToken=$PAGE"
            curl -sS "$URL" -o page.json
            jq -r '.items[]?.name' page.json >> objects.txt
            PAGE=$(jq -r '.nextPageToken // empty' page.json)
            [ -z "$PAGE" ] && break
          done
          echo "Objects in product: $(wc -l < objects.txt)"
          if [ ! -s objects.txt ]; then echo "::error::GCS listing empty"; exit 1; fi
          grep -E '(MTD_MSIL1C\.xml$|/MTD_TL\.xml$|/QI_DATA/|_B02\.jp2$|_B04\.jp2$)' objects.txt > keep.txt
          echo "Downloading $(wc -l < keep.txt) files"
          while read -r OBJ; do
            REL="${OBJ#tiles/56/J/NP/}"
            DEST="scene/$REL"
            mkdir -p "$(dirname "$DEST")"
            curl -sS "https://storage.googleapis.com/$BUCKET/$OBJ" -o "$DEST"
          done < keep.txt

      - name: Write config + spot grids
        run: |
          mkdir -p out out/debug
          cat > config.yaml <<'YAML'
          GLOBAL_ESTIMATOR:
            WAVE_EST_METHOD: "SPATIAL_DFT"
            SELECTED_FRAMES:
              - "B02"
              - "B04"
            OUTPUT_FORMAT: "POINT"
            DXP: 100.0
            DYP: 100.0
            LAYERS_TYPE: "DEBUG"
            NKEEP: 3
            OFFSHORE_LIMIT: 200
            WINDOW: 800.0
            SM_LENGTH: 10
            MIN_D: 2
            MIN_T: 3
            MAX_T: 40
            MIN_WAVES_LINEARITY: 0.3
            MAX_WAVES_LINEARITY: 0.9
            DEPTH_EST_METHOD: "LINEAR"
          SPATIAL_DFT:
            PROMINENCE_MAX_PEAK: 0.3
            PROMINENCE_MULTIPLE_PEAKS: 0.1
            UNWRAP_PHASE_SHIFT: False
            ANGLE_AROUND_PEAK_DIR: 10
            STEP_T: 0.05
            DEBUG:
              PLOT_MAX: 135
              PLOT_MIN: -135
          TEMPORAL_CORRELATION:
            TEMPORAL_LAG: 3
            PERCENTAGE_POINTS: 1
            TUNING:
              DETREND_TIME_SERIES: 1
              FILTER_TIME_SERIES: 1
              LOWCUT_PERIOD: 25
              HIGHCUT_PERIOD: 8
              PEAK_DETECTION_HEIGHT_RATIO: 0.3
              PEAK_DETECTION_DISTANCE_RATIO: 0.5
              RATIO_SIZE_CORRELATION: 1
              MEDIAN_FILTER_KERNEL_RATIO_SINOGRAM: 0.25
              MEAN_FILTER_KERNEL_SIZE_SINOGRAM: 5
              SIGMA_CORRELATION_MASK: 2
              MEDIAN_FILTER_KERNEL: 5
          SPATIAL_CORRELATION:
            CORRELATION_MODE: 'full'
            AUGMENTED_RADON_FACTOR: 0.01
            PEAK_POSITION_MAX_FACTOR: 0.8
            DEBUG:
              PLOT_MAX: 135
              PLOT_MIN: -135
          YAML
          cat > point.yaml <<'YAML'
          DEBUG_POINTS:
            - [546012, 6889598]
            - [546012, 6889748]
            - [546012, 6889898]
            - [546162, 6889598]
            - [546162, 6889748]
            - [546162, 6889898]
            - [546312, 6889598]
            - [546312, 6889748]
            - [546312, 6889898]
            - [547771, 6887486]
            - [547771, 6887636]
            - [547771, 6887786]
            - [547921, 6887486]
            - [547921, 6887636]
            - [547921, 6887786]
            - [548071, 6887486]
            - [548071, 6887636]
            - [548071, 6887786]
            - [551686, 6884478]
            - [551686, 6884628]
            - [551686, 6884778]
            - [551836, 6884478]
            - [551836, 6884628]
            - [551836, 6884778]
            - [551986, 6884478]
            - [551986, 6884628]
            - [551986, 6884778]
            - [544647, 6892262]
            - [544647, 6892412]
            - [544647, 6892562]
            - [544797, 6892262]
            - [544797, 6892412]
            - [544797, 6892562]
            - [544947, 6892262]
            - [544947, 6892412]
            - [544947, 6892562]
          YAML
          echo "config + 36 points written"

      - name: Run S2Shores (POINT grid, Gold Coast)
        run: |
          SCENE=$(find scene -maxdepth 1 -type d -name '*.SAFE')
          echo "SCENE=$SCENE"
          ./venv/bin/s2shores \
            --input_product "$SCENE" \
            --product_type S2 \
            --output_dir out \
            --config_file config.yaml \
            --debug_file point.yaml \
            --debug_path out/debug \
            --delta_times_dir S2Shores/src/s2shores/bathylauncher/config/CNES > s2shores.log 2>&1 || echo "S2SHORES_EXIT=$?" >> s2shores.log
          echo "=== log tail ==="; tail -15 s2shores.log
          echo "=== outputs ==="; find out -maxdepth 2 -name '*.nc' -exec ls -la {} \;

      - name: Read depths per spot + write summary
        if: always()
        run: |
          {
            echo "## S2Shores depth - Gold Coast spots (3x3 grid each, MAX_T=40 s)"
            echo "Scene S2B 2026-07-28 T56JNP, 2.4% cloud."
            echo ""
            echo "### Per-spot results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ./venv/bin/python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, numpy as np
          import xarray as xr
          from collections import defaultdict
          spots = [('PalmBeach', 546162, 6889748), ('Currumbin', 547921, 6887636), ('Kirra', 551836, 6884628), ('Burleigh', 544797, 6892412)]
          fs = sorted(glob.glob('out/**/*.nc', recursive=True))
          if not fs:
              print(">>> no NetCDF produced"); raise SystemExit
          ds = xr.open_dataset(fs[-1])
          def col(*names):
              for nm in names:
                  for v in ds.variables:
                      if v.lower()==nm: return np.ravel(ds[v].values)
              return None
          X=col('x'); Y=col('y'); D=col('depth','bathymetry','z'); P=col('period')
          n=len(X)
          def nearest(e,nn):
              return min(spots, key=lambda s:(s[1]-e)**2+(s[2]-nn)**2)[0]
          g=defaultdict(list); rows=defaultdict(list)
          for i in range(n):
              sname=nearest(X[i],Y[i])
              d=D[i] if D is not None else float('nan')
              p=P[i] if P is not None else float('nan')
              rows[sname].append((d,p))
              if D is not None and np.isfinite(d): g[sname].append(d)
          for s in spots:
              nm=s[0]; vals=g.get(nm,[])
              periods=[f"{p:.0f}" for d,p in rows.get(nm,[]) if np.isfinite(d)]
              if vals:
                  va=np.array(vals)
                  print(f"{nm:11s}: {len(vals)}/9 pts  median={np.median(va):5.1f} m  range {va.min():.1f}-{va.max():.1f}  periods={periods}s")
              else:
                  print(f"{nm:11s}: 0/9 pts  (no clean wave signal - too close to shore/surf)")
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2shores-goldcoast-out
          path: |
            out
            s2shores.log
