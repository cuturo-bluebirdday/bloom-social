name: S2Shores Depth Proof (Fish Rock)
# Wave-inversion bathymetry over a 5x5 grid of points around Fish Rock Cave,
# from the FREE public Sentinel-2 bucket (no credentials). Period cap relaxed to
# 40 s so estimates are not all filtered. Results written to the run Step Summary.
on:
  workflow_dispatch:

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: System deps (GDAL + jq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin libgdal-dev python3-gdal jq
          gdalinfo --version

      - name: Clone S2Shores (code + CNES delta-time tables)
        run: git clone --depth 1 https://github.com/CNES/S2Shores.git S2Shores

      - name: Python environment
        run: |
          python3 -m venv --system-site-packages venv
          ./venv/bin/pip install -q --upgrade pip
          ./venv/bin/pip install -q rasterio xarray netcdf4 shapely \
            "dask[dataframe]" distributed numba matplotlib pyyaml click pandas pyarrow cmcrameri
          ./venv/bin/pip install -q --no-deps ./S2Shores
          # system GDAL gdal_array is built against NumPy 1.x; keep the whole stack on NumPy 1.x
          ./venv/bin/pip install -q "numpy<2" "scipy<1.14" "scikit-image<0.25"
          ./venv/bin/python -c "import numpy; from osgeo import gdal, gdal_array; import s2shores; print('READY - GDAL', gdal.__version__, 'NumPy', numpy.__version__)"

      - name: Download scene subset from public GCS bucket
        run: |
          set -e
          BUCKET=gcp-public-data-sentinel-2
          PROD=S2B_MSIL1C_20260728T235229_N0512_R130_T56JNL_20260729T021752.SAFE
          PREFIX=tiles/56/J/NL/$PROD/
          : > objects.txt
          PAGE=""
          while : ; do
            URL="https://storage.googleapis.com/storage/v1/b/$BUCKET/o?prefix=$PREFIX&maxResults=1000"
            [ -n "$PAGE" ] && URL="$URL&pageToken=$PAGE"
            curl -sS "$URL" -o page.json
            jq -r '.items[]?.name' page.json >> objects.txt
            PAGE=$(jq -r '.nextPageToken // empty' page.json)
            [ -z "$PAGE" ] && break
          done
          echo "Objects in product: $(wc -l < objects.txt)"
          if [ ! -s objects.txt ]; then echo "::error::GCS listing empty"; exit 1; fi
          grep -E '(MTD_MSIL1C\.xml$|/MTD_TL\.xml$|/QI_DATA/|_B02\.jp2$|_B04\.jp2$)' objects.txt > keep.txt
          echo "Downloading $(wc -l < keep.txt) files"
          while read -r OBJ; do
            REL="${OBJ#tiles/56/J/NL/}"
            DEST="scene/$REL"
            mkdir -p "$(dirname "$DEST")"
            curl -sS "https://storage.googleapis.com/$BUCKET/$OBJ" -o "$DEST"
          done < keep.txt

      - name: Write config + grid points
        run: |
          mkdir -p out out/debug
          cat > config.yaml <<'YAML'
          GLOBAL_ESTIMATOR:
            WAVE_EST_METHOD: "SPATIAL_DFT"
            SELECTED_FRAMES:
              - "B02"
              - "B04"
            OUTPUT_FORMAT: "POINT"
            DXP: 100.0
            DYP: 100.0
            LAYERS_TYPE: "DEBUG"
            NKEEP: 3
            OFFSHORE_LIMIT: 200
            WINDOW: 800.0
            SM_LENGTH: 10
            MIN_D: 2
            MIN_T: 3
            MAX_T: 40
            MIN_WAVES_LINEARITY: 0.3
            MAX_WAVES_LINEARITY: 0.9
            DEPTH_EST_METHOD: "LINEAR"
          SPATIAL_DFT:
            PROMINENCE_MAX_PEAK: 0.3
            PROMINENCE_MULTIPLE_PEAKS: 0.1
            UNWRAP_PHASE_SHIFT: False
            ANGLE_AROUND_PEAK_DIR: 10
            STEP_T: 0.05
            DEBUG:
              PLOT_MAX: 135
              PLOT_MIN: -135
          TEMPORAL_CORRELATION:
            TEMPORAL_LAG: 3
            PERCENTAGE_POINTS: 1
            TUNING:
              DETREND_TIME_SERIES: 1
              FILTER_TIME_SERIES: 1
              LOWCUT_PERIOD: 25
              HIGHCUT_PERIOD: 8
              PEAK_DETECTION_HEIGHT_RATIO: 0.3
              PEAK_DETECTION_DISTANCE_RATIO: 0.5
              RATIO_SIZE_CORRELATION: 1
              MEDIAN_FILTER_KERNEL_RATIO_SINOGRAM: 0.25
              MEAN_FILTER_KERNEL_SIZE_SINOGRAM: 5
              SIGMA_CORRELATION_MASK: 2
              MEDIAN_FILTER_KERNEL: 5
          SPATIAL_CORRELATION:
            CORRELATION_MODE: 'full'
            AUGMENTED_RADON_FACTOR: 0.01
            PEAK_POSITION_MAX_FACTOR: 0.8
            DEBUG:
              PLOT_MAX: 135
              PLOT_MIN: -135
          YAML
          cat > point.yaml <<'YAML'
          DEBUG_POINTS:
            - [503654, 6582996]
            - [503904, 6582996]
            - [504154, 6582996]
            - [504404, 6582996]
            - [504654, 6582996]
            - [503654, 6583246]
            - [503904, 6583246]
            - [504154, 6583246]
            - [504404, 6583246]
            - [504654, 6583246]
            - [503654, 6583496]
            - [503904, 6583496]
            - [504154, 6583496]
            - [504404, 6583496]
            - [504654, 6583496]
            - [503654, 6583746]
            - [503904, 6583746]
            - [504154, 6583746]
            - [504404, 6583746]
            - [504654, 6583746]
            - [503654, 6583996]
            - [503904, 6583996]
            - [504154, 6583996]
            - [504404, 6583996]
            - [504654, 6583996]
          YAML
          echo "config + 25 grid points written"

      - name: Run S2Shores (POINT grid, Fish Rock)
        run: |
          SCENE=$(find scene -maxdepth 1 -type d -name '*.SAFE')
          echo "SCENE=$SCENE"
          ./venv/bin/s2shores \
            --input_product "$SCENE" \
            --product_type S2 \
            --output_dir out \
            --config_file config.yaml \
            --debug_file point.yaml \
            --debug_path out/debug \
            --delta_times_dir S2Shores/src/s2shores/bathylauncher/config/CNES > s2shores.log 2>&1 || echo "S2SHORES_EXIT=$?" >> s2shores.log
          echo "=== log tail ==="; tail -25 s2shores.log
          echo "=== outputs ==="; find out -maxdepth 2 -name '*.nc' -exec ls -la {} \;

      - name: Read depth grid + write summary
        if: always()
        run: |
          {
            echo "## S2Shores depth grid - Fish Rock (5x5, 250 m spacing, MAX_T=40 s)"
            echo "Center E504154 N6583496 (UTM 56S). Known real depth ~20-24 m."
            echo ""
            echo "### S2Shores log (tail)"
            echo '```'
            tail -30 s2shores.log 2>/dev/null || echo "(no log)"
            echo '```'
            echo "### Per-point results"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          ./venv/bin/python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import glob, numpy as np
          try:
              import xarray as xr
          except Exception as e:
              print("xarray missing", e); raise SystemExit
          fs = sorted(glob.glob('out/**/*.nc', recursive=True))
          print("NetCDF outputs:", fs)
          if not fs:
              print(">>> no NetCDF produced"); raise SystemExit
          ds = xr.open_dataset(fs[-1])
          print("variables:", list(ds.variables))
          def col(*names):
              for n in names:
                  for v in ds.variables:
                      if v.lower()==n:
                          return np.ravel(ds[v].values)
              return None
          X=col('x'); Y=col('y'); D=col('depth','bathymetry','z')
          S=col('status'); P=col('period'); W=col('wavelength'); DIR=col('direction_from_north','direction')
          n = len(X) if X is not None else 0
          print(f"points: {n}")
          hdr = "  E        N          depth   status  period  wavelength  dir"
          print(hdr)
          valid=[]
          for i in range(n):
              e = X[i] if X is not None else float('nan')
              nn = Y[i] if Y is not None else float('nan')
              d = D[i] if D is not None else float('nan')
              s = S[i] if S is not None else float('nan')
              p = P[i] if P is not None else float('nan')
              w = W[i] if W is not None else float('nan')
              dr = DIR[i] if DIR is not None else float('nan')
              if D is not None and np.isfinite(d): valid.append(d)
              print(f"{e:8.0f} {nn:9.0f}   {d:7.2f}  {s!s:>5}  {p:6.1f}  {w:9.1f}  {dr:6.1f}")
          if valid:
              va=np.array(valid)
              print(f"\nvalid depths: {len(va)}/{n}  median={np.median(va):.1f} m  mean={np.mean(va):.1f} m  min={va.min():.1f}  max={va.max():.1f}  std={va.std():.1f}")
          else:
              print("\nno valid depth estimates survived filtering")
          PY
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s2shores-grid-out
          path: |
            out
            s2shores.log
